services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge
    ports:
      - "5432:5432"
    volumes:
      - cloudforge-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudforge
      DB_USER: cloudforge
      DB_PASSWORD: cloudforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  scheduler-service:
    build:
      context: .
      dockerfile: scheduler-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudforge
      DB_USER: cloudforge
      DB_PASSWORD: cloudforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  worker-agent:
    build:
      context: .
      dockerfile: worker-agent/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SCHEDULER_URL: http://scheduler-service:8081
    depends_on:
      - scheduler-service

volumes:
  cloudforge-postgres-data:
