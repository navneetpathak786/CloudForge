server:
  port: 8081

spring:
  application:
    name: scheduler-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cloudforge}
    username: ${DB_USER:cloudforge}
    password: ${DB_PASSWORD:cloudforge}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # scheduler-service shares its Postgres database with api-service, each owning
    # a different table (workers vs jobs) but both numbering migrations from V1.
    # A separate history table keeps the two services' migrations from colliding
    # in Flyway's checksum validation.
    table: flyway_schema_history_scheduler
    baseline-on-migrate: true
    baseline-version: "0"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    # scheduler-service only owns the workers table (db/migration). It also reads/writes
    # the jobs table that api-service owns, so for its own isolated local/test Postgres
    # instance it bootstraps a standalone copy of that table from db/migration-local -
    # never applied against the real shared database.
    locations: classpath:db/migration,classpath:db/migration-local

# The embedded Windows redis-server binary's INFO reply contains a
# backslash-heavy executable path that Spring Data Redis's health
# indicator misparses as a Properties escape sequence. Redis itself
# is real and functional (verified via raw PING); only the health
# probe is disabled here, and only for local.
management:
  health:
    redis:
      enabled: false
